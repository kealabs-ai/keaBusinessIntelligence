<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kea Business Intelligence</title>
    <link rel="stylesheet" href="/estilos/main.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Business Intelligence Dashboard</h1>
        </header>
        
        <main>
            <div class="filters">
                <input type="date" id="startDate">
                <input type="date" id="endDate">
                <button onclick="loadData()">Atualizar</button>
                <a href="/business-intelligence" style="margin-left: 20px; padding: 8px 16px; background: #1976d2; color: white; text-decoration: none; border-radius: 4px;">Dashboard Moderno</a>
            </div>
            
            <div class="dashboard">
                <div class="chart-container">
                    <canvas id="salesChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="productsChart"></canvas>
                </div>
                <div class="metrics">
                    <div id="customerMetrics"></div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="/javascript/dashboard.js"></script>
</body>
</html>
