version: '3.8'

services:
  kea-bi-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kea-bi-app
    ports:
      - "6000:6000"
      - "6001:6001" 
      - "6002:6002"
    env_file:
      - ../.env.prod
    environment:
      - ENVIRONMENT=production
      - SERVER_PORT=6000
    user: root
    privileged: true
    restart: unless-stopped
    command: python start_container.py