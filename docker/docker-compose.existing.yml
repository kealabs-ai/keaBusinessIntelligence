version: '3.8'

services:
  kea-bi-existing:
    image: kea-business-intelligence:latest
    container_name: f79a4a4b7c0b
    ports:
      - "6000:6000"
      - "6001:6001" 
      - "6002:6002"
    environment:
      - ENVIRONMENT=production
      - SERVER_PORT=6000
    volumes:
      - .:/app
    restart: unless-stopped
    command: python /app/start_container.py